# Déploie les fonctions serveur sur Supabase à chaque modification de supabase/functions.
# Secret GitHub requis : SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
name: Déployer les fonctions Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uyqjgbbgcyxxdrkuxenn
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer toutes les fonctions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
