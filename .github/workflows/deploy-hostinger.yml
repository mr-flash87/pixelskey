# Compile le site et l'envoie sur Hostinger (public_html) à chaque push sur main.
# Secrets GitHub requis (hPanel → Fichiers → Comptes FTP) :
#   FTP_SERVER   (ex. ftp.pixelskey.app ou l'IP indiquée par Hostinger)
#   FTP_USERNAME
#   FTP_PASSWORD
name: Déployer le site sur Hostinger

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", "docs/**", "*.md"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compiler
        run: cp .env.example .env && npm run build
      - name: Envoyer sur Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
