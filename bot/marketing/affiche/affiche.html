<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Affiche Digital Pass — Reste Premium</title>
<style>
  @font-face { font-family: "Jakarta"; font-weight: 700; src: url(../promo/assets/fonts/plus-jakarta-sans-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Jakarta"; font-weight: 800; src: url(../promo/assets/fonts/plus-jakarta-sans-latin-800-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  #poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: "Jakarta", "Noto Color Emoji", sans-serif; color: #fff;
            background: #000; }
  #bg { position: absolute; left: 0; top: 250px; width: 1080px; height: 1350px; }
  #fade { position: absolute; left: 0; right: 0; top: 0; height: 560px; background: linear-gradient(180deg, #000 0%, #000 44%, rgba(0,0,0,.6) 64%, rgba(0,0,0,0) 100%); }
  #botfade { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  #wave { position: absolute; left: -260px; top: -380px; width: 900px; height: 1100px; border-radius: 50%; border-right: 10px solid rgba(140,90,255,.55); filter: blur(6px); box-shadow: 30px 0 80px rgba(110,60,255,.45); transform: rotate(-12deg); }
  .abs { position: absolute; }

  /* Logo */
  #logo { left: 0; right: 0; top: 40px; display: flex; justify-content: center; align-items: center; gap: 14px; }
  #logo img.mark { height: 84px; }
  #logo img.word { height: 52px; }

  /* Boutons de la colonne de gauche */
  #list { left: 70px; top: 190px; width: 400px; display: flex; flex-direction: column; gap: 16px; }
  .pill { position: relative; height: 78px; border-radius: 16px; display: flex; align-items: center; gap: 22px; padding: 0 26px;
          background: linear-gradient(90deg, rgba(39,181,255,.96) 0%, rgba(123,59,255,.92) 55%, rgba(123,59,255,0) 100%);
          border-top: 2px solid rgba(255,255,255,.75); border-left: 2px solid rgba(255,255,255,.55);
          box-shadow: inset 0 10px 18px rgba(255,255,255,.28), 0 14px 30px rgba(20,0,60,.45); }
  .pill svg { width: 30px; height: 30px; flex: none; }
  .pill span { font-weight: 800; font-size: 37px; letter-spacing: -.5px; text-shadow: 0 3px 8px rgba(10,0,40,.55); line-height: 1; }
  .pill span.two { font-size: 29px; line-height: .95; }

  /* Titre */
  #title { left: 505px; top: 170px; width: 540px; font-weight: 800; line-height: .9; }
  #title .l1 { font-size: 112px; letter-spacing: -4px; background: linear-gradient(95deg, #27B5FF, #8F5BFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #title .l2 { font-size: 132px; letter-spacing: -5.5px; margin-left: -14px; background: linear-gradient(180deg, #FFF8EC 20%, #CDB6FF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 18px rgba(123,59,255,.45)); }
  #para { left: 495px; top: 405px; width: 545px; font-weight: 800; font-size: 24px; line-height: 1.13; letter-spacing: -.6px; text-shadow: 0 2px 10px rgba(0,0,0,.8); }

  /* Bas */
  .tag { border-radius: 14px; background: linear-gradient(95deg, #27B5FF, #8F5BFF); color: #0D0A2E; font-weight: 800; box-shadow: 0 12px 30px rgba(20,0,60,.5); }
  #badge { left: 100px; bottom: 60px; padding: 14px 26px; font-size: 27px; line-height: 1.08; text-align: center; }
  #handle { right: 70px; bottom: 70px; padding: 12px 26px 12px 14px; display: flex; align-items: center; gap: 14px; font-size: 32px; border-radius: 999px; }
  #handle .ic { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="poster">
  <img id="bg" src="fond.png" alt="">
  <div id="fade"></div>
  <div id="wave"></div>
  <div id="botfade"></div>
  <div id="logo" class="abs"><img class="mark" src="../promo/assets/logo-mark-t.png" alt=""><img class="word" src="../promo/assets/logo-word-t.png" alt="Digital Pass"></div>

  <div id="list" class="abs"></div>

  <div id="title" class="abs"><div class="l1">Reste</div><div class="l2">Premium</div></div>
  <div id="para" class="abs">Débloque tes abonnements premium sans carte bancaire. ChatGPT, Netflix, Canva, CapCut, Spotify et plus de 70 services. Paie avec Orange Money, Moov Money ou Wave et reçois tes accès automatiquement en quelques minutes, 24h/24.</div>

  <div id="badge" class="abs tag">Rapide. Automatique<br>et 100 % sécurisé</div>
  <div id="handle" class="abs tag"><span class="ic"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M21.5 3.5 2.8 10.7c-1 .4-1 1.8.1 2.1l4.6 1.4 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.6 4.6 3.4c.8.6 1.9.1 2.1-.9l3-15c.2-1.1-.9-2-2.1-1.6Z" fill="#2AABEE"/><path d="m9 14.6 8.6-7.5L8.2 13.7" fill="none" stroke="#fff" stroke-width="1.2"/></svg></span>@DigitalPassBf_bot</div>
</div>
<script>
  const star = '<svg viewBox="0 0 24 24"><path d="M12 1c.6 5.6 4.4 9.4 10 10-5.6.6-9.4 4.4-10 10-.6-5.6-4.4-9.4-10-10C7.6 10.4 11.4 6.6 12 1Z" fill="#0D0A2E"/></svg>';
  const items = ["ChatGPT", "Netflix", "Canva", "CapCut", "Spotify", "IA &amp;<br>Streaming"];
  document.getElementById("list").innerHTML = items.map((t) => `<div class="pill">${star}<span${t.includes("<br>") ? ' class="two"' : ""}>${t}</span></div>`).join("");
</script>
</body>
</html>
